title = "<aqua>ApolloCraft</aqua> <gray>• Teleportes"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  spawn {
    slot = 10
    material = BEACON
    name = "<green><bold>Spawn</bold>"
    lore = ["<gray>Voltar ao ponto inicial."]
    click { left = ["close", "command:spawn"] }
  }

  casas {
    slot = 11
    material = RED_BED
    name = "<red><bold>Casas</bold>"
    lore = ["<gray>Ver, criar e gerenciar casas."]
    click { left = ["close", "command:home"] }
  }

  warps {
    slot = 12
    material = COMPASS
    name = "<blue><bold>Warps</bold>"
    lore = ["<gray>Locais oficiais do servidor."]
    click { left = ["close", "command:warp"] }
  }

  playerwarps {
    slot = 13
    material = LODESTONE
    name = "<light_purple><bold>Warps de jogadores</bold>"
    lore = ["<gray>Explore locais da comunidade."]
    click { left = ["close", "command:pwarp"] }
  }

  rtp {
    slot = 14
    material = CHORUS_FRUIT
    name = "<aqua><bold>Teleporte aleatório</bold>"
    lore = ["<gray>Ir para uma área aleatória."]
    click { left = ["close", "command:rtp"] }
  }

  voltar_local {
    slot = 15
    material = ENDER_EYE
    name = "<yellow><bold>Voltar</bold>"
    lore = ["<gray>Retornar ao local anterior."]
    click { left = ["close", "command:back"] }
  }

  preferencias {
    slot = 16
    material = COMPARATOR
    name = "<gray><bold>Preferências</bold>"
    lore = ["<gray>Controle pedidos de teleporte."]
    click { left = ["close", "command:tpsettings"] }
  }

  menu {
    slot = 22
    material = ARROW
    name = "<yellow>Voltar ao menu"
    click { left = ["open:apollo"] }
  }
}
