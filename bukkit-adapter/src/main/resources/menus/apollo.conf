# Central visual do jogador. O item configurado em openers.conf abre esta tela sem exigir comando.
# Cada botão possui uma única ação para funcionar do mesmo jeito no Java e no Bedrock.
title = "<gradient:#4aa3ff:#9b6bff>ApolloCraft</gradient> <gray>• Menu"
rows = 5
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  teleportes {
    slot = 10
    material = ENDER_PEARL
    name = "<aqua><bold>Teleportes</bold>"
    lore = ["<gray>Spawn, casas, warps e RTP.", "<yellow>Toque para abrir"]
    click { left = ["open:apollo-teleportes"] }
  }

  economia {
    slot = 12
    material = GOLD_INGOT
    name = "<gold><bold>Economia</bold>"
    lore = ["<gray>Carteira, banco e rankings.", "<yellow>Toque para abrir"]
    click { left = ["open:apollo-economia"] }
  }

  utilidades {
    slot = 14
    material = CRAFTING_TABLE
    name = "<green><bold>Utilidades</bold>"
    lore = ["<gray>Kits, cofres e ferramentas.", "<yellow>Toque para abrir"]
    click { left = ["open:apollo-utilidades"] }
  }

  social {
    slot = 16
    material = PLAYER_HEAD
    name = "<light_purple><bold>Jogador e social</bold>"
    lore = ["<gray>Correio, perfil e preferências.", "<yellow>Toque para abrir"]
    click { left = ["open:apollo-social"] }
  }

  casas {
    slot = 28
    material = RED_BED
    name = "<red><bold>Minhas casas</bold>"
    lore = ["<gray>Abra sua lista de casas."]
    click { left = ["close", "command:home"] }
  }

  warps {
    slot = 30
    material = COMPASS
    name = "<blue><bold>Warps</bold>"
    lore = ["<gray>Veja os locais do servidor."]
    click { left = ["close", "command:warp"] }
  }

  kits {
    slot = 32
    material = CHEST
    name = "<yellow><bold>Kits</bold>"
    lore = ["<gray>Veja e resgate seus kits."]
    click { left = ["close", "command:kit"] }
  }

  cofres {
    slot = 34
    material = ENDER_CHEST
    name = "<dark_purple><bold>Cofres</bold>"
    lore = ["<gray>Abra seus cofres pessoais."]
    click { left = ["close", "command:vault"] }
  }

  fechar {
    slot = 40
    material = BARRIER
    name = "<red>Fechar"
    click { left = ["close"] }
  }
}
