title = "<light_purple>ApolloCraft</light_purple> <gray>• Jogador"
rows = 4
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  correio {
    slot = 10
    material = CHEST
    name = "<gold><bold>Correio</bold>"
    lore = ["<gray>Leia suas mensagens recebidas."]
    click { left = ["close", "command:mail"] }
  }

  ignorados {
    slot = 12
    material = PAPER
    name = "<gray><bold>Jogadores ignorados</bold>"
    lore = ["<gray>Gerencie sua lista de bloqueios."]
    click { left = ["close", "command:ignorelist"] }
  }

  mensagens {
    slot = 14
    material = OAK_SIGN
    name = "<aqua><bold>Preferências de mensagens</bold>"
    lore = ["<gray>Controle mensagens privadas."]
    click { left = ["close", "command:msgsettings"] }
  }

  teleportes {
    slot = 16
    material = COMPARATOR
    name = "<blue><bold>Preferências de teleporte</bold>"
    lore = ["<gray>Controle pedidos recebidos."]
    click { left = ["close", "command:tpsettings"] }
  }

  votar {
    slot = 19
    material = DIAMOND
    name = "<green><bold>Votar no servidor</bold>"
    lore = ["<gray>Veja os sites de votação."]
    click { left = ["close", "command:vote"] }
  }

  regras {
    slot = 21
    material = BOOK
    name = "<yellow><bold>Regras</bold>"
    lore = ["<gray>Leia as regras do servidor."]
    click { left = ["close", "command:rules"] }
  }

  online {
    slot = 23
    material = PLAYER_HEAD
    name = "<light_purple><bold>Jogadores online</bold>"
    lore = ["<gray>Veja quem está conectado."]
    click { left = ["close", "command:list"] }
  }

  tempo {
    slot = 25
    material = CLOCK
    name = "<gold><bold>Tempo jogado</bold>"
    lore = ["<gray>Consulte seu tempo no servidor."]
    click { left = ["close", "command:playtime"] }
  }

  menu {
    slot = 31
    material = ARROW
    name = "<yellow>Voltar ao menu"
    click { left = ["open:apollo"] }
  }
}
