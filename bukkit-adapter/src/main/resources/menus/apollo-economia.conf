title = "<gold>ApolloCraft</gold> <gray>• Economia"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  carteira {
    slot = 10
    material = EMERALD
    name = "<green><bold>Carteira</bold>"
    lore = ["<gray>Saldo e histórico de transações."]
    click { left = ["close", "command:wallet"] }
  }

  banco {
    slot = 12
    material = GOLD_BLOCK
    name = "<gold><bold>Banco</bold>"
    lore = ["<gray>Acesse seus bancos e contas."]
    click { left = ["close", "command:bank"] }
  }

  ranking {
    slot = 14
    material = SUNFLOWER
    name = "<yellow><bold>Mais ricos</bold>"
    lore = ["<gray>Veja o ranking de saldos."]
    click { left = ["close", "command:baltop"] }
  }

  cambio {
    slot = 16
    material = AMETHYST_SHARD
    name = "<light_purple><bold>Câmbio</bold>"
    lore = ["<gray>Troque entre moedas disponíveis."]
    click { left = ["close", "command:exchange"] }
  }

  emprestimos {
    slot = 19
    material = WRITABLE_BOOK
    name = "<aqua><bold>Empréstimos</bold>"
    lore = ["<gray>Consulte seus empréstimos."]
    click { left = ["close", "command:loan"] }
  }

  ranks {
    slot = 25
    material = EXPERIENCE_BOTTLE
    name = "<blue><bold>Ranks</bold>"
    lore = ["<gray>Veja sua progressão no servidor."]
    click { left = ["close", "command:ranks"] }
  }

  menu {
    slot = 22
    material = ARROW
    name = "<yellow>Voltar ao menu"
    click { left = ["open:apollo"] }
  }
}
