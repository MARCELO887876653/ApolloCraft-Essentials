name: Build ApolloCraft Essentials

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ApolloCraft Essentials
        uses: actions/checkout@v4
        with:
          path: uxmEssentials

      - name: Checkout uxmLib
        uses: actions/checkout@v4
        with:
          repository: UXPLIMA/uxm-lib
          ref: 1355286525ed1c5a3598787131ffc7d120cec0ba
          path: uxmLib

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Warm Paper dev bundle
        working-directory: uxmEssentials
        run: ./gradlew :bukkit-adapter:paperweightUserdevSetup --no-parallel

      - name: Build ApolloCraft Essentials JAR
        working-directory: uxmEssentials
        run: ./gradlew :bukkit-adapter:shadowJar --no-daemon --no-parallel

      - name: Show generated files
        run: ls -lah uxmEssentials/bukkit-adapter/build/libs/

      - name: Upload ApolloCraft Essentials JAR
        uses: actions/upload-artifact@v4
        with:
          name: ApolloCraft-Essentials
          path: uxmEssentials/bukkit-adapter/build/libs/ApolloCraft-Essentials-*.jar
          if-no-files-found: error
          retention-days: 30
