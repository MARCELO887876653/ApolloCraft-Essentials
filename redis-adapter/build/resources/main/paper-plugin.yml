name: ApolloCraftEssentials-Redis
version: '0.9.1-apollocraft.1'
main: com.uxplima.uxmessentials.redis.UxmEssentialsRedisPlugin
api-version: '1.21'
authors: ['ApolloCraft', 'UXPLIMA']
description: 'Optional Redis pub/sub transport for ApolloCraft Essentials, based on the original uxmEssentials transport.'
website: 'https://github.com/UXPLIMA/uxmEssentials'

# Folia: Lettuce runs all its I/O on its own Netty event loop, off any region or tick thread.
folia-supported: true

# This companion implements the host plugin's BusTransport SPI and registers the implementation with the
# ServicesManager. The transport instance is handed to the host's bus core, so both sides must resolve
# BusTransport to the same class object — join-classpath puts the host's classes on this plugin's classloader
# (the modern paper-plugin loader isolates classpaths by default, so this opt-in is mandatory, not cosmetic).
# load: AFTER means the host is enabled first; the host defers resolving the Redis transport to its first global
# tick, by which point this plugin's onEnable has registered the factory.
dependencies:
  server:
    ApolloCraftEssentials:
      load: AFTER
      required: true
      join-classpath: true
